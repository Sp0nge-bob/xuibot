[project]
name = "vpn-platega-bot"
version = "1.3.0"
description = "Полноценный Telegram-бот для продажи VPN подписок с оплатой через Platega и выдачей ключей через 3x-ui"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram>=3.15.0,<4.0.0",
    "aiohttp>=3.11.11",
    "py3xui>=0.7.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "h11>=0.16.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "apscheduler>=3.10.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=11.1.0",
    "httpx>=0.28.1",
    "cryptography>=44.0.1",
    "loguru>=0.7.0",
    "redis>=5.0.0,<6.0.0",
    "incy-link-encoder>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "config*", "db*", "services*", "ui*", "utils*"]
exclude = ["data*", "grokerrorreports*", "tests*"]
